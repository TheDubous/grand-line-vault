name: Grand Line Vault tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate app syntax
        run: node --check app.js
      - name: Run regression tests
        run: for test in tests/*.cjs; do echo "Running $test"; node "$test"; done
